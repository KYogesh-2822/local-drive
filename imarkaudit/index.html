<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Download Example</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> <!-- Include html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js"></script> <!-- Include DOMPurify -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> <!-- Include jsPDF -->
</head>
<body>
    <a href="#" id="download-pdf">Download PDF</a>

    <script>
        $('#download-pdf').on('click', function(e) {
            e.preventDefault();

            $.get('page-to-download.html', function(data) {
                // Sanitize HTML using DOMPurify
                var cleanData = DOMPurify.sanitize(data);

                // Convert the sanitized HTML content to PDF
                var doc = new jspdf.jsPDF();
                doc.html(cleanData, {
                    callback: function (doc) {
                        doc.save('downloaded-page.pdf');
                    },
                    x: 10,
                    y: 10
                });
            });
        });
    </script>
</body>
</html>
